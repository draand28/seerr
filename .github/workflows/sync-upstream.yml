name: Sync with upstream develop

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    # Never run this on the upstream repository if the branch is ever mirrored there.
    if: github.repository == 'draand28/seerr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manage-own-requests
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebase our commits onto upstream develop
        id: rebase
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/seerr-team/seerr.git
          git fetch --no-tags upstream develop
          if git rebase upstream/develop; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort || true
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the rebased branch
        if: steps.rebase.outputs.result == 'ok'
        run: git push --force-with-lease origin HEAD:manage-own-requests

      - name: Open an issue when the rebase conflicts
        if: steps.rebase.outputs.result == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream develop no longer rebases cleanly';
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            if (found.data.total_count > 0) {
              core.info('An issue is already open; skipping.');
              return;
            }
            const body = [
              'The nightly sync could not rebase `manage-own-requests` onto `seerr-team/seerr@develop`.',
              '',
              'Upstream most likely changed code that our changes also touch. Resolve it manually:',
              '',
              '```sh',
              'git fetch upstream develop',
              'git rebase upstream/develop',
              '# resolve conflicts',
              'git push --force-with-lease origin manage-own-requests',
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
